<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 修复：禁止缩放，严格匹配设备宽度 -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f0f4fb 0%, #e8edf8 100%);
            color: #1f2937;
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 16px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            z-index: 1;
        }
        /* 散落贴纸装饰：最顶层，不捕获鼠标事件 */
        .decor-sticker {
            position: absolute;
            z-index: 9999;
            pointer-events: none;
            max-width: 22vw; /* 小屏幕自动按视口百分比缩小，不会溢出 */
        }
        /* 左上 */
        .sticker-1 {
            top: 0px;
            left: -8px;
            transform: rotate(-6deg);
            width: 112px;
        }
        /* 右上 */
        .sticker-2 {
            top: 80px;
            right: -10px;
            transform: rotate(7deg);
            width: 112px;
        }
        /* 左下*/
        .sticker-3 {
            bottom: 100px;
            left: -8px;
            transform: rotate(4deg);
            width: 90px;
        }
        /* 右下 */
        .sticker-4 {
            bottom: 170px;
            right: -14px;
            transform: rotate(-9deg);
            width: 112px;
        }
        @media(max-width:420px){
            .decor-sticker{
                width:82px;
            }
            .sticker-1 {
                top: 5px;
                left: -5px;
            .sticker-3{
                bottom: 90px
            }
            .sticker-4 {
                bottom: 100px;
            }
        }
        .card {
            background: #ffffff;
            border-radius: 22px;
            padding: 32px 20px;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.1);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .version-text {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .alert-warning {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            line-height: 1.65;
            font-size:15px;
        }
        .alert-wechat {
            background: #eff6ff;
            border-left:4px solid #2563eb;
            padding:14px 16px;
            border-radius:12px;
            margin-bottom:24px;
            line-height:1.65;
            font-size:15px;
        }
        .download-button {
            display:block;
            width:100%;
            background: linear-gradient(90deg,#2563eb,#3b78f5);
            color:#ffffff;
            text-align:center;
            padding:16px 0;
            border-radius:14px;
            border: none;
            font-size:17px;
            font-weight:500;
            cursor: pointer;
            transition: all 0.24s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.22);
        }
        .download-button:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.18);
        }
        .feedback-btn {
            display:block;
            width:100%;
            background: #10b981;
            color:#ffffff;
            text-align:center;
            padding:14px 0;
            border-radius:14px;
            border: none;
            font-size:16px;
            font-weight:500;
            cursor: pointer;
            transition: all 0.24s ease;
            margin-top:14px;
        }
        .feedback-btn:active {
            transform: scale(0.97);
        }
        .file-desc {
            text-align:center;
            margin-top:12px;
            font-size:13px;
            color:#6b7280;
        }
        .info-area {
            margin-top:28px;
            line-height:1.8;
            font-size:14px;
        }
        .footer-note {
            margin-top:32px;
            text-align:center;
            font-size:12px;
            color:#9ca3af;
        }
        /* 弹窗：修正居中布局，保证水平垂直居中 */
        .modal-mask {
            position: fixed;
            inset:0;
            background-color: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding:12px;
            z-index:10000;
            opacity:0;
            visibility:hidden;
            transition: 0.22s;
        }
        .modal-mask.show {
            opacity:1;
            visibility:visible;
        }
        .modal-box {
            background:#fff;
            width:100%;
            max-width:420px;
            border-radius:20px;
            padding:24px 20px;
            max-height: 85vh;
            overflow-y: auto;
            margin: 0 auto;
        }
        .modal-title {
            font-size:19px;
            font-weight:600;
            margin-bottom:10px;
        }
        .modal-text {
            font-size:14px;
            line-height:1.7;
            color:#4b5563;
            margin-bottom:20px;
        }
        .modal-buttons {
            display:flex;
            gap:10px;
            margin-top:20px;
        }
        .modal-btn-cancel {
            flex:1;
            padding:12px 0;
            border-radius:12px;
            border:1px solid #d1d5db;
            background:#ffffff;
            font-size:15px;
            cursor:pointer;
        }
        .modal-btn-confirm {
            flex:1;
            padding:12px 0;
            border-radius:12px;
            border:none;
            background:#2563eb;
            color:white;
            font-size:15px;
            cursor:pointer;
        }
        /* 评分问卷 */
        .score-item {
            margin-bottom:18px;
        }
        .score-label {
            font-size:14px;
            margin-bottom:8px;
            display:block;
            color:#1f2937;
        }
        /* 仅校验失败时才标红 */
        .score-label.error{
            color:#ef4444;
        }
        /* 评分单选组整体居中 */
        .score-radio {
            display:flex;
            justify-content: center;
            gap:8px;
        }
        .score-radio label {
            width:34px;
            height:34px;
            line-height:34px;
            text-align:center;
            border-radius:50%;
            border:1px solid #d1d5db;
            font-size:14px;
            cursor:pointer;
            color:#6b7280;
        }
        .score-radio input:checked + label {
            background:#2563eb;
            color:#fff;
            border-color:#2563eb;
        }
        .score-radio input {
            display:none;
        }
        textarea {
            width:100%;
            border:1px solid #e5e7eb;
            border-radius:12px;
            padding:12px;
            font-size:14px;
            min-height:72px;
            resize:vertical;
            margin-top:6px;
        }
        /* 提交成功弹窗 */
        .success-modal{
            position: fixed;
            inset:0;
            background:rgba(0,0,0,0.45);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:10001;
            opacity:0;
            visibility:hidden;
            transition:0.22s;

        }

        }

            border-radius:12px;
            border:none;
            background:#2563eb;
            color:#fff;
            font-size:15px;
            cursor:pointer;
        }
    </style>

    <!-- 提交成功弹窗 -->

            <div class="success-text">✅ 反馈提交成功<br>感谢您宝贵的建议！</div>
            <button class="success-close-btn" id="successClose">关闭</button>
        </div>
    </div>
    <script>
        // =========填入APK的HTTPS下载链接=========
        const APK_URL = "替换成你的真实APK下载链接";
        const triggerModal = document.getElementById('triggerModal');
        const modalMask = document.getElementById('modalMask');
        const modalCancel = document.getElementById('modalCancel');
        const modalDownload = document.getElementById('modalDownload');
        triggerModal.addEventListener('click', ()=>{
            modalMask.classList.add('show');
        });
        function closeModal(){
            modalMask.classList.remove('show');
        }
        modalCancel.addEventListener('click', closeModal);
        modalMask.addEventListener('click',(e)=>{
            if(e.target === modalMask) closeModal();
        })
        modalDownload.addEventListener('click',()=>{
            const a = document.createElement('a');
            a.href = APK_URL;
            a.setAttribute('download','speakinggo_v1.0.0_20260819.apk');
            document.body.appendChild(a);
            a.click();
            a.remove();
            closeModal();
        })
        const feedbackModal = document.getElementById('feedbackModal');
        const openFeedback = document.getElementById('openFeedback');
        const closeFeedback = document.getElementById('closeFeedback');
        const successModal = document.getElementById('successModal');
        const successClose = document.getElementById('successClose');

        openFeedback.onclick = ()=> feedbackModal.classList.add('show');
        closeFeedback.onclick = ()=> {
            feedbackModal.classList.remove('show');
        };
        feedbackModal.onclick = (e)=>{
            if(e.target === feedbackModal) feedbackModal.classList.remove('show');
        }
        // 成功弹窗关闭事件：关闭后关闭网页
        successClose.onclick = ()=>{
            successModal.classList.remove('show');
            window.close();
        }

        const radioGroups = ['s1','s2','s3','s4','s5','s6'];
        // 选择选项时移除红色错误标记
        radioGroups.forEach(name=>{
            const radios = document.querySelectorAll(`input[name="${name}"]`);
            const labelEl = document.querySelector(`label[data-name="${name}"]`);
            radios.forEach(r=>{
                r.addEventListener('change',()=>{
                    labelEl.classList.remove('error');
                })
            })
        })

        const submitFeedback = document.getElementById("submitFeedback");

        submitFeedback.onclick = async ()=>{
            // 先清除全部旧的红色错误
            radioGroups.forEach(name=>{
                const labelEl = document.querySelector(`label[data-name="${name}"]`);
                labelEl.classList.remove('error');
            })

            let unfinished = [];
            function getScore(name){
                const checked = document.querySelector(`input[name="${name}"]:checked`);
                const labelEl = document.querySelector(`label[data-name="${name}"]`);
                if(!checked){
                    unfinished.push(labelEl.innerText);
                    labelEl.classList.add('error');
                    return "";
                }
                return checked.value;
            }
            const s1_val = getScore('s1');
            const s2_val = getScore('s2');
            const s3_val = getScore('s3');
            const s4_val = getScore('s4');
            const s5_val = getScore('s5');
            const s6_val = getScore('s6');

            // 拦截提交，有未完成项直接return
            if(unfinished.length > 0){
                alert(`⚠️请完成所有评分项！\n未完成：${unfinished.join("、")}`);
                return;
            }

            const bugText = document.getElementById('bugText').value.trim();
            const suggestText = document.getElementById('suggestText').value.trim();
            const time = new Date().toLocaleString();

            // 组装表单参数，不是JSON
            const params = new URLSearchParams();
            params.append("s1_score", s1_val);
            params.append("s2_score", s2_val);
            params.append("s3_score", s3_val);
            params.append("s4_score", s4_val);
            params.append("s5_score", s5_val);
            params.append("s6_score", s6_val);
            params.append("bug_description", bugText);
            params.append("suggestion", suggestText);
            params.append("submit_time", time);

            const FORMSPREE_ENDPOINT = "https://formspree.io/f/mrpzdkvg";

            try {
                const resp = await fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: params
                });
                if(!resp.ok) throw new Error("提交失败");
                // 提交成功：关闭问卷弹窗，弹出成功提示
                feedbackModal.classList.remove('show');
                successModal.classList.add('show');
                resetForm();
            }catch(err){
                console.error(err);
                // 失败降级复制到剪贴板
                const result = `【口语Go内测反馈】${time}
1.模拟考试评分准确度：${s1_val}分
2.评分分差合理性：${s2_val}分
3.录音识别准确度：${s3_val}分
4.语法建议准确度：${s4_val}分
5.交互设计体验：${s5_val}分
6.APP使用流畅度：${s6_val}分
——————
【Bug问题描述】
${bugText || "无"}
——————
【功能优化建议】
${suggestText || "无"}`;
                if(navigator.clipboard && window.isSecureContext){
                    navigator.clipboard.writeText(result);
                }
                alert("⚠️服务器提交失败，反馈已复制剪贴板，请手动保存");
                resetForm();
            }
        };

        function resetForm(){
            document.querySelectorAll('input[type=radio]').forEach(el=>el.checked=false);
            document.getElementById('bugText').value = "";
            document.getElementById('suggestText').value = "";
            //重置全部，去掉红色
            radioGroups.forEach(name=>{
                const labelEl = document.querySelector(`label[data-name="${name}"]`);
                labelEl.classList.remove('error');
            })
        }
    </script>
